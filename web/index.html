<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlantCore | Production Command</title><link rel="stylesheet" href="/app.css"></head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">P<span>C</span></div><div><strong>PLANT<br>CORE</strong><small>Multi-factory operations</small></div></div>
    <div class="nav-label">WORKSPACE</div>
    <nav id="nav">
      <button data-page="overview" class="active"><span>◫</span> Control tower</button>
      <button data-page="orders"><span>▤</span> Orders & allocation</button>
      <button data-page="investigate"><span>◇</span> Disruption lab</button>
      <button data-page="recovery"><span>↗</span> Recovery simulator</button>
      <button data-page="warroom"><span>☷</span> Production war room</button>
      <button data-page="improvement"><span>◎</span> PDCA & learning</button>
    </nav>
    <div class="sidebar-bottom"><div class="live-dot"></div><div><strong id="sidebarSource">Loading source</strong><small id="sidebarDate">Planning scenario · USD</small></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb">OPERATIONS <span>/</span> <span id="crumb-current">CONTROL TOWER</span></div><div class="top-actions"><button class="quiet small" onclick="showDefinitions()">KPI definitions</button><span class="scenario-badge" id="dataBadge">● SIMULATED DATA</span><span class="avatar">PM</span></div></header>
    <div class="scenario-bar"><div class="scenario-description"><strong id="scenarioName">Loading scenario…</strong><small id="scenarioDescription">Select a test scenario or upload your own order file.</small></div><div class="scenario-tools"><select id="scenarioSelector" class="selector" aria-label="Select test scenario" onchange="changeScenario(this.value)"></select><label class="secondary upload-button" for="scenarioUpload">↑ Upload file<input id="scenarioUpload" type="file" accept=".json,.csv,.xlsx,application/json,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" onchange="uploadScenario(this.files[0])" hidden></label><a class="secondary template-link" href="/sample-orders.csv" download>↓ CSV template</a><select id="reportSelector" class="selector" aria-label="Download report" onchange="downloadReport(this.value);this.value=''"><option value="">↓ Download report…</option><option value="management.html">Management report · HTML</option><option value="management.json">Full report · JSON</option><option value="orders.csv">Order forecast · CSV</option><option value="scenario">Current scenario · JSON</option></select></div></div>
    <div id="content" class="content"><div class="loading">Loading operational model…</div></div>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body></html>
