name: PlantCore quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app
      - run: node --check web/app.js && node --check web/enterprise.js && node --check web/visualizations.js && node --check site/browser-adapter.js && node --check site/python-worker.js
      - run: python scripts/validate_scenarios.py
      - run: python scripts/validate_visualizations.py
      - run: python scripts/build_pages.py
